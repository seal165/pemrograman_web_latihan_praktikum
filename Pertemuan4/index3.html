<!DOCTYPE html>
<html>
<body>
    <button onclick="myFunction()">Try It</button>
    <p id="demo"></p>
    <script>
      function myFunction() {
        let person = prompt("Silahkan masukkan nama ", "Saya");
        if (person != null) {
          document.getElementById(
            "demo"
          ).innerHTML = `Halo ${person} hari ini sedang ada praktikum web`;
        }
      }
    </script>
</body>
</html>
