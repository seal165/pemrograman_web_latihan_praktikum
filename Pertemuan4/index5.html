<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Onclick</title>
</head>
<body>
    <button id="btn">Coba Klik</button>
    <p id="demo"></p>

    <script>
    const button = document.getElementById("btn");

    button.addEventListener("click", function() {
      document.getElementById("demo").innerHTML = "Hore, Kamu klik buttonnya";
    });
    </script>
</body>
</html>
